name: Weekly AdBlock review (candidate-only)

on:
  schedule:
    # 09:17 Asia/Shanghai every Wednesday; weekly date gate starts 2026-10-21.
    - cron: '17 1 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyze only; do not create a branch or PR'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/adblock-review.yml'
      - 'scripts/biweekly_review.py'
      - 'tests/test_biweekly_review.py'
      - 'tests/test_biweekly_integration.py'
      - 'docs/reviews/**'
      - 'rules/candidates/**'
      - 'Shadowrocket-AdBlock*.sgmodule'
      - 'shortcuts/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: adblock-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test and guard stable subscription
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/biweekly_review.py validate
      - name: Reject changes to stable runtime files in review-only PRs
        if: startsWith(github.head_ref, 'automation/adblock-review-')
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD -- Shadowrocket-AdBlock.sgmodule 'Shadowrocket-AdBlock-lok.*.sgmodule' scripts/adblock-clean.js shortcuts/ | grep .; then
            echo 'Stable module, Cleaner and shortcuts must not be changed by automated review PRs' >&2
            exit 1
          fi

  review:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Baseline tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/biweekly_review.py validate
      - name: Enforce weekly date gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATE="$(TZ=Asia/Shanghai date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=${INPUT_DRY_RUN:-true}" >> "$GITHUB_OUTPUT"
          elif [ "$(python3 scripts/biweekly_review.py due --date "$DATE")" = "due" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping off-cycle Wednesday ($DATE)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify upstream and generate report
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_DATE: ${{ steps.gate.outputs.date }}
          DRY_RUN: ${{ steps.gate.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/biweekly_review.py scan --date "$REVIEW_DATE" --dry-run
          else
            python3 scripts/biweekly_review.py scan --date "$REVIEW_DATE"
          fi
      - name: Create candidate-only Draft PR
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -eu
          BRANCH="automation/adblock-review-$REVIEW_DATE"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Existing review branch $BRANCH; stopping to avoid overwriting it" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$BRANCH"
          git add -- "docs/reviews/$REVIEW_DATE.md" "docs/reviews/$REVIEW_DATE.json" "rules/candidates/$REVIEW_DATE.list"
          if git diff --cached --quiet; then
            echo "No changes to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: review upstream ad domains for $REVIEW_DATE"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "review: AdBlock upstream candidates $REVIEW_DATE" \
            --body "Automated source-domain review ONLY. No stable module, iOS shortcut, Rewrite, MITM or response Cleaner changes. All candidates are unverified and require owner approval before release. See docs/reviews/$REVIEW_DATE.md and .json."
